name: Coleta do Radar

on:
  schedule:
    - cron: "17 11,21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radar-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Atualizar catálogo no Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Configure os secrets do Supabase em Settings → Secrets and variables → Actions."
            exit 1
          fi
          python radar.py --collect --max-lots 12
