services:
  - type: web
    name: radar-leiloes
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web:app
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: RADAR_OWNER_EMAIL
        sync: false
      - key: RADAR_SESSION_SECRET
        generateValue: true
  - type: cron
    name: radar-coleta
    runtime: python
    schedule: "0 11,21 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python radar.py --collect --max-lots 12
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false

